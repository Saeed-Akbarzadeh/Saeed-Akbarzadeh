name: Update Profile Repositories

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate terminal profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Saeed-Akbarzadeh
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No profile changes detected."
            exit 0
          fi
          git add README.md assets/monitor.svg assets/monitor.template.svg assets/repo-*.svg assets/repositories-empty.svg assets/footer.svg scripts/update_profile.py scripts/README.md .github/workflows/update-profile.yml
          git commit -m "chore: refresh terminal profile"
          git push
