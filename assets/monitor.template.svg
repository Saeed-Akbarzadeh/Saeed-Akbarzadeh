<g transform="translate(1000 370)" class="pulse">
  <circle r="73" fill="none" stroke="#00FF00" stroke-opacity=".16" stroke-width="2"/>
  <circle r="52" fill="none" stroke="#00FF00" stroke-opacity=".46" stroke-width="2"/>
  <circle r="27" fill="none" stroke="#00FF00" stroke-opacity=".82" stroke-width="2"/>
  <circle r="6" fill="#00FF00" filter="url(#glow)"/>
  <path d="M-92 0H-58M58 0H92M0-92V-58M0 58V92" stroke="#00FF00" stroke-opacity=".7"/>
  <g class="orbit"><circle cx="0" cy="-73" r="4" fill="#7EE787"/></g>
</g>

