  <path d="M730 145L1110 80M710 205L1145 130M750 265L1160 190" stroke="#00FF00" stroke-width="2"/>
  <circle cx="930" cy="215" r="82" fill="none" stroke="#00FF00"/>
  <circle cx="930" cy="215" r="120" fill="none" stroke="#00FF00"/>
  <path d="M930 90V340M805 215H1055" stroke="#00FF00" stroke-opacity=".5"/>
</g>
<g opacity=".10" class="float2">
