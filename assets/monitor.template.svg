<text x="104" y="315" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#FFFFFF">SAEED AKBARZADEH</text>
<text x="104" y="356" font-family="monospace" font-size="20" fill="#00FF00">PYTHON DEVELOPER  ·  AUTOMATION  ·  WEB</text>
<text x="104" y="390" font-family="monospace" font-size="15" fill="#8B949E">Building practical software with clean architecture and real-world utility.</text>
