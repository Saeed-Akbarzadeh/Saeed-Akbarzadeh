<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540">
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#08150B"/><stop offset="55%" stop-color="#020604"/><stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" x2="1">
    <stop offset="0%" stop-color="#0C1117"/><stop offset="50%" stop-color="#1A2028"/><stop offset="100%" stop-color="#0C1117"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop offset="0%" stop-color="#00FF00" stop-opacity="0"/><stop offset="50%" stop-color="#00FF00" stop-opacity=".24"/><stop offset="100%" stop-color="#00FF00" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vignette"><stop offset="50%" stop-color="#00FF00" stop-opacity="0"/><stop offset="100%" stop-color="#00FF00" stop-opacity=".12"/></radialGradient>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#00FF00" stroke-opacity=".085"/>
  </pattern>
  <pattern id="microgrid" width="15" height="15" patternUnits="userSpaceOnUse">
    <path d="M15 0H0V15" fill="none" stroke="#00FF00" stroke-opacity=".035"/>
  </pattern>
  <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="3" fill="#FFFFFF" fill-opacity=".025"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .pulse{animation:p 2.8s ease-in-out infinite}.blink{animation:b 1.05s steps(2,end) infinite}
    .scan{animation:s 5.5s linear infinite}.float1{animation:f1 9s ease-in-out infinite}.float2{animation:f2 12s ease-in-out infinite}
    .flow{stroke-dasharray:9 15;animation:d 1.8s linear infinite}.ticker{animation:t 18s linear infinite}
    .beam{animation:beam 4.8s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:o 12s linear infinite}
    @keyframes p{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes b{50%{opacity:0}}
    @keyframes s{0%{transform:translateY(-300px)}100%{transform:translateY(1540px)}}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
    @keyframes d{to{stroke-dashoffset:-48}}
    @keyframes t{from{transform:translateX(0)}to{transform:translateX(-900px)}}
    @keyframes beam{0%,100%{opacity:.15}50%{opacity:.55}}
    @keyframes o{to{transform:rotate(360deg)}}
  </style>
</defs>

<!-- monitor chassis -->
<rect x="18" y="18" width="1164" height="1504" rx="38" fill="#070A0D" stroke="#3B444E" stroke-width="5"/>
<rect x="35" y="35" width="1130" height="1470" rx="29" fill="#030705" stroke="#151D24" stroke-width="2"/>
<rect x="45" y="45" width="1110" height="1450" rx="25" fill="url(#screen)"/>
<rect x="45" y="45" width="1110" height="1450" rx="25" fill="url(#grid)"/>
<rect x="45" y="45" width="1110" height="1450" rx="25" fill="url(#microgrid)"/>
<rect x="45" y="45" width="1110" height="1450" rx="25" fill="url(#vignette)"/>
<rect x="45" y="45" width="1110" height="1450" rx="25" fill="url(#scanlines)"/>
<rect x="45" y="-220" width="1110" height="230" fill="url(#beam)" class="scan"/>

<!-- top terminal chrome -->
<rect x="45" y="45" width="1110" height="62" rx="25" fill="url(#chrome)"/>
<circle cx="79" cy="76" r="8" fill="#FF5F56"/><circle cx="104" cy="76" r="8" fill="#FFBD2E"/><circle cx="129" cy="76" r="8" fill="#27C93F"/>
<text x="157" y="82" font-family="monospace" font-size="16" fill="#8B949E">saeed@github ~ developer-console</text>
<text x="1068" y="82" text-anchor="end" font-family="monospace" font-size="13" fill="#27C93F">● ONLINE</text>

<!-- layered parallax HUD -->
