<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#05070A"/>
    <stop offset="0.5" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#05070A"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0" stop-color="#00FF00" stop-opacity=".15"/>
    <stop offset=".5" stop-color="#00FF00" stop-opacity=".02"/>
    <stop offset="1" stop-color="#00FF00" stop-opacity=".15"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .scan { animation: scan 4s linear infinite; }
    .blink { animation: blink 1.1s steps(2,end) infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes scan { 0%{transform:translateY(-120px)} 100%{transform:translateY(360px)} }
    @keyframes blink { 50%{opacity:0} }
  </style>
</defs>

<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#30363D"/>

<g opacity=".18">
  <path d="M0 70H1200M0 120H1200M0 170H1200M0 220H1200M0 270H1200" stroke="#00FF00"/>
  <path d="M120 0V330M240 0V330M360 0V330M480 0V330M600 0V330M720 0V330M840 0V330M960 0V330M1080 0V330" stroke="#00FF00"/>
</g>

<rect x="0" y="0" width="1200" height="330" fill="url(#glow)" class="pulse"/>

<rect x="0" y="0" width="1200" height="330" fill="#00FF00" opacity=".04" class="scan" filter="url(#soft)"/>

<rect x="0" y="0" width="1200" height="46" rx="24" fill="#161B22"/>
<circle cx="28" cy="23" r="7" fill="#FF5F56"/>
<circle cx="50" cy="23" r="7" fill="#FFBD2E"/>
<circle cx="72" cy="23" r="7" fill="#27C93F"/>
<text x="96" y="29" font-family="monospace" font-size="15" fill="#8B949E">saeed@github:~</text>

<text x="70" y="105" font-family="monospace" font-size="24" fill="#00FF00">$ whoami</text>
<text x="70" y="158" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Saeed Akbarzadeh</text>
<text x="70" y="204" font-family="monospace" font-size="22" fill="#00FF00">Python Developer  ·  Automation  ·  Web Development</text>
<text x="70" y="246" font-family="monospace" font-size="16" fill="#8B949E">Building practical software with clean architecture and reliable engineering.</text>

<text x="70" y="286" font-family="monospace" font-size="17" fill="#00FF00">$ _</text>
<rect x="95" y="272" width="10" height="20" fill="#00FF00" class="blink"/>

<g transform="translate(1040 165)" class="pulse">
  <circle r="62" fill="none" stroke="#00FF00" stroke-opacity=".28" stroke-width="2"/>
  <circle r="42" fill="none" stroke="#00FF00" stroke-opacity=".45" stroke-width="2"/>
  <circle r="7" fill="#00FF00"/>
</g>
</svg>