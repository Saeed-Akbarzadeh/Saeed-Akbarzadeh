<text x="104" y="270" font-family="monospace" font-size="15" fill="#7EE787">[ OK ] portfolio mounted</text>
<text x="104" y="338" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">SAEED AKBARZADEH</text>
<text x="104" y="378" font-family="monospace" font-size="21" fill="#00FF00">PYTHON DEVELOPER  ·  AUTOMATION  ·  WEB DEVELOPMENT</text>
<text x="104" y="416" font-family="monospace" font-size="15" fill="#8B949E">Remote-ready developer building practical, maintainable software.</text>
