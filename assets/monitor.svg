<rect x="72" y="126" width="1056" height="392" rx="20" fill="#050A07" fill-opacity=".84" stroke="#00FF00" stroke-opacity=".34" stroke-width="2"/>
<text x="104" y="174" font-family="monospace" font-size="18" fill="#00FF00">$ boot profile --verbose</text>
