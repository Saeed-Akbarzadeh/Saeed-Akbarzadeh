<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380">
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07110A"/><stop offset="58%" stop-color="#020604"/><stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" x2="1">
    <stop offset="0%" stop-color="#11161C"/><stop offset="50%" stop-color="#1A2028"/><stop offset="100%" stop-color="#11161C"/>
  </linearGradient>
  <radialGradient id="vignette"><stop offset="56%" stop-color="#00FF00" stop-opacity="0"/><stop offset="100%" stop-color="#00FF00" stop-opacity=".11"/></radialGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#00FF00" stroke-opacity=".10"/></pattern>
  <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#FFFFFF" fill-opacity=".023"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .pulse{animation:p 3s ease-in-out infinite}.blink{animation:b 1.05s steps(2,end) infinite}
    .scan{animation:s 5.2s linear infinite}.float{animation:f 8s ease-in-out infinite}
    .flow{stroke-dasharray:10 16;animation:d 2s linear infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes b{50%{opacity:0}}
    @keyframes s{0%{transform:translateY(-280px)}100%{transform:translateY(1380px)}}
    @keyframes f{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-8px)}}
    @keyframes d{to{stroke-dashoffset:-52}}
  </style>
</defs>

<rect x="22" y="22" width="1156" height="1336" rx="34" fill="#090C10" stroke="#3B444E" stroke-width="4"/>
<rect x="42" y="42" width="1116" height="1296" rx="26" fill="url(#screen)" stroke="#1F2933" stroke-width="2"/>
<rect x="42" y="42" width="1116" height="1296" rx="26" fill="url(#grid)"/>
<rect x="42" y="42" width="1116" height="1296" rx="26" fill="url(#vignette)"/>
<rect x="42" y="42" width="1116" height="1296" rx="26" fill="url(#scanlines)"/>
<rect x="42" y="-160" width="1116" height="220" fill="#00FF00" fill-opacity=".05" class="scan"/>

<rect x="42" y="42" width="1116" height="58" rx="26" fill="url(#chrome)"/>
<circle cx="76" cy="71" r="8" fill="#FF5F56"/><circle cx="101" cy="71" r="8" fill="#FFBD2E"/><circle cx="126" cy="71" r="8" fill="#27C93F"/>
<text x="154" y="78" font-family="monospace" font-size="16" fill="#8B949E">saeed@github — developer-console</text>

