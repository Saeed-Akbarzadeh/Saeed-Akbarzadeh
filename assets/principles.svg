<circle cx="42" cy="64" r="6" fill="#00FF00" class="dot d2"/><text x="62" y="69">Simple architecture over unnecessary complexity</text>
<circle cx="42" cy="94" r="6" fill="#00FF00" class="dot d3"/><text x="62" y="99">Explicit validation and error handling</text>
<circle cx="42" cy="124" r="6" fill="#00FF00" class="dot d4"/><text x="62" y="129">Tests for important behavior</text>
<circle cx="42" cy="154" r="6" fill="#00FF00" class="dot d5"/><text x="62" y="159">Maintainability over demo-only code</text>
